name: Publish relay candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: afk-relay-candidate
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    uses: ./.github/workflows/container.yml
    with:
      tag: sha-${{ github.sha }}
    permissions:
      contents: read
      packages: write
