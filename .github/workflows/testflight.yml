name: TestFlight internal
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version label for this beta, e.g. v0.1.0-rc.1 (no Git tag is created)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: afk-apple-delivery
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  upload:
    needs: checks
    uses: ./.github/workflows/apple.yml
    with:
      tag: ${{ inputs.tag }}
      platform: ios
    secrets: inherit
