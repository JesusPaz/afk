name: afk-dev
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: afk
      POSTGRES_PASSWORD: ${AFK_DATABASE_PASSWORD:?required}
      POSTGRES_DB: afk
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afk -d afk"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
